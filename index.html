<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&A · Simulación RFID</title>
<style>
:root{--ink:#151515;--muted:#666;--line:#e5e5e5;--soft:#f6f6f4;--accent:#111}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
header{border-bottom:1px solid #ddd;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:27px;letter-spacing:-1.5px}.tag{font-size:11px;border:1px solid #bbb;padding:6px 9px;border-radius:20px}
main{max-width:900px;margin:auto;padding:22px 18px 40px}.search{display:flex;gap:10px;margin-bottom:20px}
input,button{font-size:16px;min-height:46px;border-radius:8px}input{flex:1;border:1px solid #bbb;padding:0 14px}button{border:0;background:#111;color:#fff;padding:0 18px;font-weight:700}
.hero{background:var(--soft);padding:20px;border-radius:14px;margin-bottom:15px}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:27px;margin:7px 0}.price{font-size:25px;font-weight:800}.code{color:var(--muted);font-size:13px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.card{border:1px solid var(--line);border-radius:12px;padding:15px}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:800;margin-top:4px}
.status{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:20px;background:#eaf6ea;font-size:12px;font-weight:700}
section{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:15px}h2{font-size:17px;margin:0 0 12px}
.rows div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.rows div:last-child{border:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f1f1f1;padding:8px 10px;border-radius:20px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.5}
@media(max-width:620px){.grid{grid-template-columns:1fr}header{padding:15px}main{padding:18px 14px}}
</style></head>
<body><header><div class="logo">C&A</div><div class="tag">SIMULACIÓN ACADÉMICA · RFID</div></header>
<main>
<div class="search"><input id="q" placeholder="Escanea un QR o escribe CA-001..." autocomplete="off"><button id="go">Consultar</button></div>
<div id="view"></div>
<div class="note">Esta interfaz es una simulación académica. Los productos, existencias y precios son ficticios y se utilizan para representar una consulta omnicanal de inventario.</div>
</main>
<script>
const products=[{"code": "CA-001", "name": "Blusa básica manga larga", "price": 399, "category": "Mujer", "store": 4, "warehouse": 18, "other": 7, "sizes": {"XS": 2, "S": 4, "M": 6, "L": 4, "XL": 2}, "stores": {"Cuautitlán Izcalli": 4, "Perinorte": 2, "Plaza Satélite": 5, "Tlalnepantla": 0}}, {"code": "CA-002", "name": "Jeans rectos denim", "price": 799, "category": "Mujer", "store": 6, "warehouse": 22, "other": 11, "sizes": {"24": 2, "26": 4, "28": 5, "30": 4, "32": 2}, "stores": {"Cuautitlán Izcalli": 6, "Perinorte": 3, "Plaza Satélite": 4, "Tlalnepantla": 4}}, {"code": "CA-003", "name": "Playera oversize algodón", "price": 299, "category": "Hombre", "store": 9, "warehouse": 31, "other": 14, "sizes": {"S": 4, "M": 7, "L": 6, "XL": 3}, "stores": {"Cuautitlán Izcalli": 9, "Perinorte": 5, "Plaza Satélite": 6, "Tlalnepantla": 3}}, {"code": "CA-004", "name": "Chamarra ligera acolchada", "price": 999, "category": "Mujer", "store": 2, "warehouse": 12, "other": 5, "sizes": {"XS": 1, "S": 2, "M": 3, "L": 1, "XL": 0}, "stores": {"Cuautitlán Izcalli": 2, "Perinorte": 1, "Plaza Satélite": 2, "Tlalnepantla": 2}}, {"code": "CA-005", "name": "Sudadera básica con capucha", "price": 649, "category": "Unisex", "store": 3, "warehouse": 16, "other": 9, "sizes": {"S": 2, "M": 4, "L": 3, "XL": 1}, "stores": {"Cuautitlán Izcalli": 3, "Perinorte": 2, "Plaza Satélite": 4, "Tlalnepantla": 3}}, {"code": "CA-006", "name": "Pantalón cargo", "price": 899, "category": "Hombre", "store": 1, "warehouse": 8, "other": 3, "sizes": {"28": 1, "30": 2, "32": 1, "34": 0, "36": 0}, "stores": {"Cuautitlán Izcalli": 1, "Perinorte": 1, "Plaza Satélite": 1, "Tlalnepantla": 1}}];
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n)}
function render(p){
 if(!p){document.getElementById('view').innerHTML='<section><b>Producto no encontrado</b><p>Prueba CA-001, CA-002, CA-003, CA-004, CA-005 o CA-006.</p></section>';return}
 const total=p.store+p.warehouse+p.other;
 const storeRows=Object.entries(p.stores).map(([k,v])=>`<div><span>🏬 ${k}</span><b>${v} piezas</b></div>`).join('');
 const sizes=Object.entries(p.sizes).map(([k,v])=>`<span class="pill">${k} · ${v}</span>`).join('');
 document.getElementById('view').innerHTML=`
 <div class="hero"><div class="eyebrow">${p.category} · Inventario omnicanal</div><h1>${p.name}</h1>
 <div class="price">${money(p.price)}</div><div class="code">Código de producto: ${p.code}</div>
 <span class="status">${p.store>0?'● Disponible en tienda':'● Sin existencias en tienda'}</span></div>
 <div class="grid">
 <div class="card"><div class="label">TIENDA ACTUAL</div><div class="big">${p.store}</div><div class="label">piezas</div></div>
 <div class="card"><div class="label">ALMACÉN</div><div class="big">${p.warehouse}</div><div class="label">piezas</div></div>
 <div class="card"><div class="label">OTRAS TIENDAS</div><div class="big">${p.other}</div><div class="label">piezas</div></div></div>
 <section><h2>Disponibilidad por talla</h2><div class="pills">${sizes}</div></section>
 <section><h2>Disponibilidad por sucursal</h2><div class="rows">${storeRows}</div></section>
 <section><h2>Resumen de disponibilidad</h2><div class="rows">
 <div><span>Inventario tienda actual</span><b>${p.store}</b></div><div><span>Inventario almacén</span><b>${p.warehouse}</b></div><div><span>Inventario otras tiendas</span><b>${p.other}</b></div><div><span>Total disponible</span><b>${total} piezas</b></div></div></section>`;
}
function find(){let q=document.getElementById('q').value.trim().toUpperCase();let p=products.find(x=>x.code===q)||products.find(x=>x.code===new URLSearchParams(location.search).get('p')?.toUpperCase());render(p||products[0])}
document.getElementById('go').addEventListener('click',find);document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
const initial=new URLSearchParams(location.search).get('p'); if(initial){document.getElementById('q').value=initial.toUpperCase();} render(products.find(x=>x.code===initial?.toUpperCase())||products[0]);
</script></body></html>
